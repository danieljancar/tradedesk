# Copy to desk.toml and adjust. Every value here is the default.

# paper: simulated fills on live Binance prices, no keys needed
# testnet: real orders on the Binance test exchange, needs testnet keys
# live: real money
mode = "paper"

# spot is long only. futures allows shorts and leverage.
market = "spot"
# Trade a futures wallet from the same runs as well. That file holds its own db_path and [risk].
# futures_desk = "data/futures.toml"
quote = "USDT"
watchlist = ["BTC", "ETH", "SOL"]

# starting balance for paper mode
paper_equity = 1000.0

[risk]
# profile = "balanced"         # conservative, balanced or aggressive; keys set below still win
risk_per_trade_pct = 1.0       # loss at the stop, as % of equity
max_open_positions = 4         # positions plus resting entries
max_total_risk_pct = 4.0       # all open stops together
max_position_pct = 25.0        # notional per trade, times leverage on futures
max_leverage = 3
min_reward_risk = 2.0
min_confidence = 60
daily_loss_limit_pct = 3.0     # no new trades for the rest of the UTC day
max_drawdown_pct = 15.0        # no new trades until equity recovers
min_stop_atr = 0.5             # stop at least this many ATRs from entry
max_stop_pct = 15.0
max_entry_distance_pct = 8.0   # limit entries further away than this are refused

[hold_days]
short = 3
mid = 21
long = 120

[execution]
auto_execute = false   # true sends every plan that passes the risk check without asking
close_expired = true   # close positions held longer than their horizon allows
entry_ttl_hours = 24   # cancel limit entries that haven't filled by then

[trailing]
enabled = true          # the sync raises stops on winning trades every 10 min
breakeven_r = 1.0       # at +1R the stop moves to entry plus fees
trail_start_r = 1.5     # from +1.5R the stop follows the price
trail_atr = 2.0         # this many ATRs behind the price (4h ATR for short trades, 1d otherwise)
lock_pct = 50.0         # and never keeps less than this share of the open gain
min_step_atr = 0.25     # smaller moves are skipped so orders aren't replaced all the time

[universe]
enabled = true                # false uses only the watchlist
min_quote_volume = 20000000   # skip pairs with less 24h volume in the quote currency
top = 6                       # movers the scan adds each day
max_assets = 12               # watchlist, always, gold and scan picks together
always = []                   # assets looked at every day on top of the watchlist
exclude = []                  # assets the scan never picks
include_gold = true           # add PAXG as gold

[notify]
telegram = false   # needs TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in .env
events = ["proposed", "fill", "exit", "error", "run", "kill"]
quiet_hours = ""   # e.g. "23-07" local time; then only errors and stop-outs come through

[portfolio]
core_pct = 0.0                 # share of equity held long term in the core sleeve, 0 is off
core_targets = {}              # core weights in %, adding up to 100, e.g. { BTC = 60, PAXG = 40 }
rebalance_band_pct = 5.0       # rebalance an asset when it drifts this far from its own target
core_stop_pct = 35.0           # wide exchange stop under every core buy
base_currency = "CHF"          # equity is also shown in this currency (FRED rate, USDT as USD)


[transfers]
enabled = false        # move free USDT between spot and futures to keep the split below
futures_pct = 35       # share of the two wallets together that sits on futures
band_pct = 10          # only move once the futures share is this far off
min_amount = 5
keep_free_pct = 10     # always leave this share of a wallet's equity free
