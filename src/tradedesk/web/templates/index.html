<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>tradedesk</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%23a6e3b8%22/%3E%3Ccircle cx=%2211%22 cy=%2214%22 r=%222.5%22/%3E%3Ccircle cx=%2221%22 cy=%2214%22 r=%222.5%22/%3E%3Cpath d=%22M11 20q5 4 10 0%22 stroke=%22black%22 stroke-width=%222%22 fill=%22none%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/desk.css">
  <script type="module" src="/static/desk.js"></script>
</head>
<body>
  <header class="top">
    <h1>tradedesk</h1>
    <p class="meta" id="meta">loading</p>
    <label class="run-pick">Run
      <select id="run"></select>
    </label>
    <button type="button" id="sync">Sync now</button>
  </header>

  <main>
    <section class="floor-wrap" aria-labelledby="floor-title">
      <div class="section-head">
        <h2 id="floor-title">Trading floor</h2>
        <p class="hint">Round ones think, square ones enforce the rules. Click anyone to read what they wrote.</p>
      </div>
      <div class="floor-scroll">
      <div class="floor" id="floor">
        <svg viewBox="0 0 1000 520" id="floor-svg" role="img" aria-label="Agents and data flow for the selected run">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 z" class="arrowhead"/>
            </marker>
          </defs>
          <g id="edges"></g>
          <g id="packets"></g>
          <g id="nodes"></g>
        </svg>
        <div id="bubbles" class="bubbles" aria-hidden="true"></div>
      </div>
      </div>
    </section>

    <section class="feed-wrap" aria-labelledby="feed-title">
      <h2 id="feed-title">What they said</h2>
      <ol class="feed" id="feed" aria-live="polite"></ol>
    </section>

    <section class="plans-wrap" aria-labelledby="plans-title">
      <h2 id="plans-title">Trade plans</h2>
      <div id="plans" class="plans"></div>
    </section>

    <section class="book-wrap" aria-labelledby="book-title">
      <h2 id="book-title">Book</h2>
      <div class="equity">
        <p id="equity-now"></p>
        <svg id="equity-chart" viewBox="0 0 300 60" preserveAspectRatio="none" role="img" aria-label="Equity over time"></svg>
      </div>
      <h3>Open positions</h3>
      <div class="table-scroll"><table id="positions"></table></div>
      <h3>Closed</h3>
      <div class="table-scroll"><table id="closed"></table></div>
    </section>
  </main>

  <dialog id="detail" popover="auto" aria-labelledby="detail-title">
    <div class="detail-head">
      <h2 id="detail-title"></h2>
      <button type="button" popovertarget="detail" popovertargetaction="hide">Close</button>
    </div>
    <div id="detail-body" class="prose"></div>
  </dialog>
</body>
</html>
